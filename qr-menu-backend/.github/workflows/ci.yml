name: Restaurant QR Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check code syntax & integrity
        run: |
          node -c server.js
          node -c socket.js
          node -c middleware/auth.js
          node -c routes/admin.js
          node -c routes/menu.js
          node -c routes/order.js
          node -c routes/qr.js
          node -c routes/kitchen.js

      - name: Build Docker Image
        run: |
          docker build -t restaurant-qr-backend:latest .

